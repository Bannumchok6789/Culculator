@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f4f5f7;color:#1f2937;font-family:Prompt,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px}
.container{width:100%;max-width:850px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:34px 16px;box-shadow:0 8px 25px #1f293710}

.brand-subtitle{font-family:Kanit,Prompt,sans-serif;font-size:20px;font-weight:700;letter-spacing:.4px;color:#000000;text-align:center;margin:0 0 22px;line-height:1.5}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matched-lottery{margin:0 0 14px;padding:12px 10px;border:1px solid #E1E7FC;border-radius:11px;background:#F3F4F6;text-align:center}.matched-label{font-size:16px;font-weight:600;color:#273C55}.matched-name{font-size:20px;font-weight:700;color:#273C90;min-height:29px;display:flex;align-items:center;justify-content:center;gap:7px}.matched-name .country-flag{width:29px;height:22px;object-fit:contain;display:inline-block;flex:none;vertical-align:middle}.matched-name .country-flag-emoji{font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif;font-size:24px;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;flex:none}.matched-note{font-size:15px;color:#64748B;margin-top:4px}.lottery-search{margin-bottom:14px}.lottery-search input{width:100%}.name-feedback{text-align:center;min-height:20px;margin:5px 0 0;font-size:13px;color:#64748b}
label{display:block;text-align:center;font-size:18px;margin-bottom:6px;color:#000;font-weight:600}
input{display:block;width:100%;height:53px;border-radius:9px;border:1px solid #d1d5db;background:white;font-size:20px;text-align:center;font-family:inherit;color:#1f2937;outline:none}
input:focus{border-color:#d8a92f;box-shadow:0 0 0 2px #f2c14d40}
button{font-family:inherit;cursor:pointer}
.calc{width:100%;margin-top:15px;padding:10px;background:#f2c14d;border:0;border-radius:9px;color:#222;font-size:18px;font-weight:600}
.reset{display:block;width:100%;margin-top:9px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#f1f5f9;color:#000;font-size:18px;font-weight:600}
.hint{text-align:center;font-size:14px;color:#000;margin:10px 0 0;font-weight:600}.error{color:#000}
.result{display:block;margin-top:16px}
.formula-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start;margin-top:15px}.formula-group{min-width:0;margin-top:0;padding-top:13px;border-top:1px solid #e5e7eb}
.group-title{text-align:center;color:#000;font-size:18px;font-weight:600;margin:0 0 8px}
.method-box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:12px;margin-top:10px}.method-title{font-size:18px;color:#000;margin:0 0 4px;font-weight:600}.method-expression{font-size:18px;font-weight:300;color:#000000;overflow-wrap:anywhere;word-break:break-word;margin:0}.result-box{background:#f9fafb;border-radius:9px;text-align:center;padding:12px 8px;margin-top:10px}
.result-title{font-size:18px;color:#000;margin-bottom:2px;font-weight:600}
.result-value{font-size:18px;font-weight:300;overflow-wrap:anywhere;color:#dc2626;line-height:1.4}
.run-value{color:#000000}
.copy{width:100%;margin-top:16px;border:1px solid #111827;border-radius:9px;background:#111827;color:#fff;padding:12px;font-size:18px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s}
.copy:disabled{background:#d1d5db;border-color:#d1d5db;color:#6b7280;cursor:not-allowed;opacity:.65}
.copy.copied{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
.copy:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
@media(max-width:350px){.container{padding:28px 12px}h1{font-size:19px}label{font-size:16px}.result-value{font-size:18px}}
/* Modern Minimal V.3 styling */
body{background:#EDF2FA;color:#172554}
.container{border-color:#DCE4F2;border-radius:22px;box-shadow:0 14px 40px #17255412;padding:34px 20px}
h1{color:#172554;font-weight:700;font-size:24px}
.brand-subtitle{color:#4755AC;font-size:22px}
label{color:#172554}
input{border-color:#DCE4F2;border-radius:11px}
input:focus{border-color:#4755AC;box-shadow:0 0 0 3px #4755AC20}
.calc{background:#F3C75A;border-radius:11px}
.reset{background:#EDF1F7;border-color:#DFE6F0;border-radius:11px;color:#172554}
.hint{color:#64748B}
.formula-columns{gap:12px}
.formula-group{border:1px solid #E1E7FC;border-radius:13px;background:#F3F5FF;padding:12px}
.formula-group:nth-child(2){background:#F2F7FF;border-color:#DCEBFF}
.group-title{color:#273C90}
.formula-group:nth-child(2) .group-title{color:#22549B}

@media(max-width:380px){.container{padding:25px 11px}.formula-columns{gap:7px}.formula-group{padding:7px}.result-box,.method-box{padding:9px 5px}.method-expression{font-size:15px}.result-title,.method-title{font-size:16px}}

/* V.3: keep the exact provided V.2 visual theme while displaying three formulas. */
.formula-columns{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.formula-group{padding:9px;min-width:0}
.formula-group:nth-child(2){background:#F3F5FF;border-color:#E1E7FC}
.formula-group:nth-child(3){background:#F2F7FF;border-color:#DCEBFF}

.formula-group .result-title,.formula-group .method-title{font-size:14px}

@media(max-width:430px){.container{padding:23px 9px}.formula-columns{gap:5px}.formula-group{padding:6px}.formula-group .result-title,.formula-group .method-title{font-size:12px}.formula-group .result-value,.formula-group .method-expression{font-size:12px}}
/* คืนรูปแบบช่วงค้นหาชื่อหวย → ค้นพบ → แหล่งข้อมูล ตามเว็บไซต์เดิม */
.lottery-search{margin-bottom:14px}
.matched-lottery{margin-bottom:0}
.external-credit{margin:7px 0 13px;text-align:center;font-size:12px;color:#64748B}
.external-credit[hidden],.matched-note[hidden],.name-feedback[hidden]{display:none}
.external-credit a{color:#22549B}

/* V.3: ทั้งสามคอลัมน์กว้างเท่ากัน สูงเท่ากัน และกล่องผลเต็มหน้ากว้าง */
.formula-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:9px}
.formula-columns>.formula-group{min-width:0;width:100%;height:100%;margin:0;display:flex;flex-direction:column;box-sizing:border-box}
.formula-columns>.formula-group>.result-box,
.formula-columns>.formula-group>.method-box{width:100%;min-width:0;box-sizing:border-box}
@media(max-width:430px){.formula-columns{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}}

/* สีประจำสูตร: สูตร 1 ชมพู, สูตร 2 ฟ้า, สูตร 3 ม่วง, สูตร 4 ส้ม */
.formula-columns>.formula-f1{background:#F3E8FF;border-color:#E2CCFC}
.formula-columns>.formula-f1 .group-title{color:#7E22CE}
.formula-columns>.formula-f2{background:#F2F7FF;border-color:#DCEBFF}
.formula-columns>.formula-f2 .group-title{color:#22549B}
.formula-columns>.formula-f3{background:#FFF1E6;border-color:#F5D6B7}
.formula-columns>.formula-f3 .group-title{color:#C45A13}
.formula-columns>.formula-f4{background:#FFF0F6;border-color:#FBCFE8}
.formula-columns>.formula-f4 .group-title{color:#DB2777}
.formula-columns>.formula-f4 .result-box{background:#fff}
/* สูตรสถิติ: กรอบแยกสีเขียว วางใต้สูตร 2 (สีฟ้า) */
.formula-columns>.formula-stats{grid-column:2;grid-row:2;background:#ECFDF3;border:1px solid #BBF7D0;border-radius:10px;padding:10px 8px}
.formula-columns>.formula-stats .group-title{color:#15803D}
.formula-columns>.formula-stats .result-box{background:#fff}

/* ขยับคำประเภท (หุ้น/หวย) กับชื่อหวยให้ชิดกันในช่องค้นพบ */
.matched-name{letter-spacing:-0.2px;line-height:1.25}

/* V.3: ตัวเลขและผลลัพธ์ทุกสูตร ขนาด 18px น้ำหนักบาง */
.formula-columns .result-value,
.formula-columns .method-expression{
  font-size:18px;
  font-weight:300;
  line-height:1.35;
  overflow-wrap:anywhere;
  word-break:break-word;
}
/* ปุ่มคัดลอกทุกปุ่มใช้สีดำเหมือนกัน */
.copy-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:9px}
.copy-actions .copy,
.copy-actions .copy:disabled,
.copy-actions .copy.copied{background:#000;border-color:#000;color:#fff}
.copy-actions .copy{width:100%;min-width:0;margin-top:0}
.copy-actions .copy:disabled{opacity:.65;cursor:not-allowed}
@media(max-width:380px){.copy-actions{gap:7px}.copy-actions .copy{font-size:15px;padding:11px 5px}}
/* ขยับเฉพาะปุ่มคัดลอกสูตร 1-2 และ 2-3 ขึ้น 1 ระยะ */
.copy-actions .copy:nth-child(-n+2){transform:translateY(-6px)}
/* Copy buttons are black by default and turn blue after a successful copy. */
.copy-actions .copy,.copy-actions .copy:hover,.copy-actions .copy:active,.copy-actions .copy:focus,.copy-actions .copy:focus-visible,.copy-actions .copy:disabled{background:#000!important;border-color:#000!important;color:#fff!important;outline:none;box-shadow:none;opacity:1}

/* ตารางผลงวดล่าสุด: แสดงหวยทุกประเภทที่มีข้อมูลจากระบบค้นหาออนไลน์ */
.history-section{margin-top:22px;border:1px solid #DCE4F2;border-radius:13px;background:#F8FAFF;padding:14px 12px}
.history-section[hidden]{display:none!important}
.history-heading{text-align:center;font-size:18px;color:#172554;font-weight:600;margin:0 0 4px}
.history-desc{text-align:center;color:#64748B;font-size:13px;margin:0 0 10px}

.history-table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}

.history-table tbody tr:first-child td{background:#EAF2FF;font-weight:700}

.history-credit{font-size:12px;text-align:center;color:#64748B;margin:10px 0 0}

.matched-lottery{margin-bottom:14px}

.history-table thead th{background:#FFFFFF;color:#27313D}
.history-table tbody td,
.history-table tbody tr:first-child td{background:#FFFFFF;color:#27313D}
.history-table tbody td{border-top:1px solid #E5EAF4}

.matched-lottery .history-table tbody td:nth-child(2),

/* V10 — uniform compact controls, sized like the logout button */
:root{--compact-control-width:194px;--compact-control-height:40px}
#logoutBtn{box-sizing:border-box;width:var(--compact-control-width);max-width:100%;height:var(--compact-control-height);min-height:var(--compact-control-height);padding:5px 10px;justify-content:center}
#calcForm{width:100%;max-width:432px;margin-inline:auto;box-sizing:border-box;grid-template-columns:repeat(2,minmax(0,var(--compact-control-width)));justify-content:center;gap:8px}
#calcForm .lottery-search{grid-column:1;width:100%;min-width:0;margin:0}
#calcForm #resetBtn{grid-column:2;align-self:end;margin:0}
#calcForm .fields,#calcForm .copy-actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,var(--compact-control-width)));gap:8px;width:100%;margin:0}
#calcForm .fields>div{min-width:0}
#calcForm .lottery-search #lotteryName,#calcForm #resetBtn,#calcForm .fields input,#calcForm .calc,#calcForm .copy-actions .copy{box-sizing:border-box;width:100%;max-width:var(--compact-control-width);height:var(--compact-control-height);min-height:var(--compact-control-height);padding-block:4px;font-size:13px;border-radius:18px;margin:0;line-height:1.4}
#calcForm .lottery-search #lotteryName{padding-left:34px;padding-right:8px;text-align:left;background-position:10px center,center}
#calcForm .calc,#calcForm .matched-lottery{grid-column:1/-1;justify-self:center}
#calcForm .matched-lottery{box-sizing:border-box;width:100%;max-width:var(--compact-control-width);min-height:var(--compact-control-height);margin:0;display:flex;flex-direction:column;justify-content:center}
#calcForm .matched-lottery:has(#latestDraw:not([hidden])),#calcForm .matched-lottery:has(#matchedNote:not([hidden])){max-width:100%;height:auto}
#calcForm .hint,#calcForm .external-credit{grid-column:1/-1}
@media(max-width:800px){#logoutBtn{width:auto;min-width:0}}
@media(max-width:480px){#calcForm{max-width:100%;gap:6px;padding:9px}#calcForm .fields,#calcForm .copy-actions{gap:6px}}


/* V11 — keep full layout width, but unify control height with logout button */
:root{--uniform-control-height:40px;}
#logoutBtn{height:var(--uniform-control-height);min-height:var(--uniform-control-height);}
#calcForm{grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:end}
#calcForm .lottery-search{grid-column:1;width:100%;min-width:0;margin:0}
#calcForm #resetBtn{grid-column:2;align-self:end;margin:0;width:100%;max-width:none;height:var(--uniform-control-height);min-height:var(--uniform-control-height);padding:6px 10px;border-radius:18px;font-size:14px}
#calcForm .matched-lottery{grid-column:1/-1;width:100%}
#calcForm .fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin:0}
#calcForm .copy-actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;margin:0}
#calcForm .lottery-search #lotteryName,
#calcForm .fields input,
#calcForm .calc,
#calcForm .copy-actions .copy{
  box-sizing:border-box;
  width:100%;
  max-width:none;
  height:var(--uniform-control-height);
  min-height:var(--uniform-control-height);
  padding-block:4px;
  border-radius:18px;
  margin:0;
  line-height:1.35;
}
#calcForm .lottery-search #lotteryName{padding-left:40px;padding-right:10px;text-align:left;background-position:12px center,center;font-size:16px}
#calcForm .fields input{padding-inline:12px;font-size:15px;text-align:center}
#calcForm .calc{font-size:16px}
#calcForm .copy-actions .copy{font-size:14px;padding-inline:10px}
