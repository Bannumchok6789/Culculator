<script>
/* Shared client-side session guard for the index page. */
(() => {
  'use strict';
  const sessionKey = 'BN_INDEX_SESSION_V2';
  const activityKey = sessionKey + '_LAST_ACTIVITY';
  const username = 'BN001';
  const idleLimitMs = 20 * 60 * 1000;
  const returnToLogin = () => { window.location.replace('./index.html'); };
  function isValidSession() {
    try {
      const last = Number(localStorage.getItem(activityKey));
      const now = Date.now();
      return localStorage.getItem(sessionKey) === username &&
        Number.isFinite(last) && last > 0 && now >= last && now - last < idleLimitMs;
    } catch (_) { return false; }
  }
  if (!isValidSession()) { returnToLogin(); return; }
  // Activity on this companion page maintains the same 20-minute idle window.
  let lastWrite = 0;
  function recordActivity() {
    if (!isValidSession()) { returnToLogin(); return; }
    const now = Date.now();
    if (now - lastWrite < 1000) return;
    try { localStorage.setItem(activityKey, String(now)); lastWrite = now; }
    catch (_) { returnToLogin(); }
  }
  for (const type of ['pointermove', 'pointerdown', 'keydown', 'input', 'touchstart', 'scroll', 'wheel']) {
    document.addEventListener(type, recordActivity, {passive:true});
  }
  window.addEventListener('storage', event => {
    if (event.key === sessionKey || event.key === activityKey || event.key === null) {
      if (!isValidSession()) returnToLogin();
    }
  });
  window.addEventListener('focus', () => { if (!isValidSession()) returnToLogin(); });
  window.addEventListener('pageshow', () => { if (!isValidSession()) returnToLogin(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !isValidSession()) returnToLogin();
  });
  setInterval(() => { if (!isValidSession()) returnToLogin(); }, 1000);
})();
</script>

<body><main>
<h1>🏠 บ้านนำโชค 6789 | ใบเปิดหุ้น</h1>
<section class="panel">
<div class="grid"><div><label for="upper">เลข 3 ตัวบน</label><input id="upper" type="text" inputmode="numeric" maxlength="3" placeholder="" autocomplete="off" aria-label="เลข 3 ตัวบน"></div><div><label for="lower">เลข 2 ตัวล่าง</label><input id="lower" type="text" inputmode="numeric" maxlength="2" placeholder="" autocomplete="off" aria-label="เลข 2 ตัวล่าง"></div></div>
<button id="calc">คำนวณ</button><div class="error" id="error" role="alert"></div>
<div class="work" aria-live="polite"><h2>วิธีคำนวณ</h2><div class="line" id="step1"></div><div class="line" id="step2"></div><div class="line" id="step3"></div></div>
<div class="win-section"><h2>เลขวิน</h2><div class="final" aria-live="polite"><div class="digits" id="final"></div></div></div>
<button class="copy" id="copy">คัดลอกผลลัพธ์</button>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let copyText='';
function calculate(){
 const upper=$('upper').value.trim(),lower=$('lower').value.trim();
 if(!/^\d{3}$/.test(upper)||!/^\d{2}$/.test(lower)){$('error').textContent='กรุณากรอกเลข 3 ตัวบน และ 2 ตัวล่างให้ครบ';return;}
 $('error').textContent='';
 const top=upper.slice(-2),a=Number(top),b=Number(lower),sum=a+b,percent=Number((sum*0.06).toFixed(10)),total=Number((sum+percent).toFixed(10));
 const fmt=n=>String(n);
 $('step1').innerHTML=`${top} + ${lower} = <strong>${fmt(sum)}</strong>`;
 $('step2').innerHTML=`${fmt(sum)} × 0.06 = <strong>${fmt(percent)}</strong>`;
 $('step3').innerHTML=`${fmt(sum)} + ${fmt(percent)} = <strong>${fmt(total)}</strong>`;
 const digits=[...new Set((fmt(sum)+fmt(percent)+fmt(total)).replace(/\D/g,''))];
 for(const d of ['6','9'])if(!digits.includes(d))digits.push(d);
 $('final').textContent=digits.join('');
 copyText=`${top} + ${lower} = ${fmt(sum)}\n${fmt(sum)} × 0.06 = ${fmt(percent)}\n${fmt(sum)} + ${fmt(percent)} = ${fmt(total)}\nเลขวิน ${digits.join('')}`;
}
$('calc').addEventListener('click',calculate);
for(const id of ['upper','lower']) $(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calculate();}});
function resetResults(){['step1','step2','step3','final'].forEach(id=>$(id).textContent='');copyText='';}
for(const id of ['upper','lower']){
 $(id).addEventListener('input',e=>{
  e.target.value=e.target.value.replace(/\D/g,'');
  $('error').textContent='';
  if(id==='upper'){
   $('lower').value='';
   if(e.target.value.length===3)$('lower').focus();
  }
  resetResults();
 });
}
$('copy').addEventListener('click',async()=>{if(!copyText){$('error').textContent='กรุณากรอกตัวเลขให้ครบก่อนคัดลอก';return;}try{
 const today=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());
 const formatted=`ใบเปิดหุ้น  :\nวันที่ ${today}\n➖➖➖➖➖➖➖➖\n${copyText.split('\n').slice(0,3).join('\n')}\n\n${copyText.split('\n')[3]}\n➖➖➖➖➖➖➖➖`;
 await navigator.clipboard.writeText(formatted);$('copy').textContent='คัดลอกแล้ว ✓';setTimeout(()=>$('copy').textContent='คัดลอกผลลัพธ์',1600)}catch{$('error').textContent='ไม่สามารถคัดลอกอัตโนมัติได้';}});
</script></body></html>
