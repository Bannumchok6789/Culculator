<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#EDF2FA">
<title>สูตรคำนวณใบเปิด 3 ฮานอย</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#EDF2FA;color:#172554;font-family:Prompt,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:14px}.container{width:100%;max-width:600px;background:white;border:1px solid #DCE4F2;border-radius:22px;box-shadow:0 14px 40px #17255412;padding:25px 15px}h1{font-size:25px;line-height:1.35;text-align:center;margin:0;color:#172554;font-weight:700}.brand{text-align:center;color:#4755AC;font-size:20px;font-weight:600;margin:5px 0 21px}.table-wrap{width:100%;overflow-x:auto}table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:20px}th,td{padding:9px 4px;border-bottom:1px solid #E1E7FC;vertical-align:middle}th{font-weight:600;color:#172554}th:first-child,td:first-child{width:34%;text-align:center}th:nth-child(2),td:nth-child(2){width:26%;text-align:center}th:last-child,td:last-child{width:40%;text-align:center;padding-left:4px}.num{width:100%;min-width:0;height:49px;border:1px solid #DCE4F2;border-radius:10px;background:white;color:#172554;font-family:inherit;font-size:20px;text-align:center;outline:none}.num:focus{border-color:#4755AC;box-shadow:0 0 0 3px #4755AC20}.out{color:#D92649;font-size:20px;font-weight:400;white-space:nowrap}.lotto{color:#273C55;font-size:20px;line-height:1.4;text-align:center}.runbox{margin-top:12px;border:1px solid #E1E7FC;border-radius:13px;background:#FFF7F7;text-align:center;padding:12px 8px}.runlabel,.run{font-size:20px}.runlabel{color:#273C55;font-weight:600}.run{color:#D92649;margin-top:3px}.winbox{margin-top:10px;border:1px solid #E1E7FC;border-radius:13px;background:#F3F5FF;text-align:center;padding:14px 8px}.winlabel,.win{font-size:20px}.winlabel{color:#273C55;font-weight:600}.win{color:#D92649;word-break:break-word;margin-top:3px}.reset{display:block;width:100%;margin-top:17px;padding:11px 10px;border:1px solid #DFE6F0;border-radius:11px;background:#EDF1F7;color:#172554;font:600 20px Prompt,sans-serif;cursor:pointer}.reset:hover{background:#E2E9F3}.copy{width:100%;margin-top:15px;padding:12px 10px;border:0;border-radius:11px;color:white;background:#000;font:600 20px Prompt,sans-serif;cursor:pointer}.copy:disabled{background:#CDD5E2;color:#718096;cursor:not-allowed}.copy.copied{background:#0EA5E9}.notice{font-size:14px;color:#64748B;text-align:center;margin:12px 0 0;min-height:21px}@media(max-width:460px){body{padding:9px}.container{padding:20px 9px}th,td{padding:7px 2px}th:last-child,td:last-child{padding-left:2px}.lotto{overflow-wrap:anywhere}}
.reference-link{text-align:center;margin:18px 0 3px}.reference-link a{display:inline-block;color:#22549B;font-size:20px;font-weight:600;text-decoration:underline;text-underline-offset:4px}.reference-link a:hover{color:#4755AC}
.runbox,.winbox{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.run,.win{margin-top:0}
</style>
</head>
<body>
<main class="container">
<h1>สูตรคำนวณใบเปิด 3 ฮานอย</h1>
<p class="brand">🏠 บ้านนำโชค6789</p>
<div class="table-wrap"><table aria-label="ตารางสูตรคำนวณใบเปิด 3 ฮานอย">
<thead><tr><th>กรอกตัวเลข</th><th>ผลลัพธ์</th><th>ชื่อหวย</th></tr></thead>
<tbody>
<tr><td><input class="num" id="a" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="000" aria-label="กรอกเลขฮานอยพิเศษ 3 หลัก"></td><td><span class="out" id="out-a">—</span></td><td class="lotto">ฮานอยพิเศษ</td></tr>
<tr><td><input class="num" id="b" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="000" aria-label="กรอกเลขฮานอย VIP 3 หลัก"></td><td><span class="out" id="out-b">—</span></td><td class="lotto">ฮานอย VIP</td></tr>
<tr><td><input class="num" id="c" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="000" aria-label="กรอกเลขฮานอยปกติ 3 หลัก"></td><td><span class="out" id="out-c">—</span></td><td class="lotto">ฮานอยปกติ</td></tr>
</tbody></table></div>
<button class="reset" id="reset" type="button">รีเซ็ต</button>
<div class="runbox"><span class="runlabel">🏃รูด</span><span class="run" id="run">—</span></div>
<div class="winbox"><span class="winlabel">🔅วิน</span><span class="win" id="win">—</span></div>
<button class="copy" id="copy" type="button" disabled>คัดลอก</button>
<p class="notice" id="notice" aria-live="polite">กรอกตัวเลข 3 หลักในแต่ละแถว</p>
</main>
<script>
'use strict';
const keys=['a','b','c'];
const inputs=keys.map(k=>document.getElementById(k));
const copy=document.getElementById('copy');
const winNode=document.getElementById('win');
const runNode=document.getElementById('run');
const notice=document.getElementById('notice');
document.getElementById('reset').addEventListener('click',()=>{inputs.forEach(input=>{input.value='';input.dispatchEvent(new Event('input',{bubbles:false}));});notice.textContent='กรอกตัวเลข 3 หลักในแต่ละแถว';inputs[0].focus();});
let currentWin='';
let currentRun='';
function calculate(){
 const outcomes=inputs.map((input,i)=>{
  const value=input.value;
  const result=/^\d{3}$/.test(value)?(Number(value)*7/100).toFixed(2):null;
  document.getElementById('out-'+keys[i]).textContent=result??'—';
  return result;
 });
 if(outcomes.some(n=>n===null)){
  currentWin='';currentRun='';winNode.textContent='—';runNode.textContent='—';copy.disabled=true;copy.classList.remove('copied');copy.textContent='คัดลอก';return;
 }
 // คงลำดับเลขที่พบ ตัดเลขซ้ำ และใช้กฎ 6/9 ก่อนแบ่งวินกับรูด
 let digits=[...new Set(outcomes.join('').replace(/\D/g,''))].join('');
 const has6=digits.includes('6'),has9=digits.includes('9');
 const added69=has6&&!has9?'9':has9&&!has6?'6':'';
 if(added69) digits+=added69;
 // 5 ตัว: เติม 0, 6 ตัว: รูด 1-2, 7 ตัว: รูด 7-1, 8 ตัวขึ้นไป: รูด 7-8
 if(digits.length===5) digits+='0';
 if(digits.length===6) currentRun=digits[0]+'-'+digits[1];
 else if(digits.length===7) currentRun=digits[6]+'-'+digits[0];
 else if(digits.length>=8) currentRun=digits[6]+'-'+digits[7];
 else currentRun=digits.length>=2?digits[0]+'-'+digits[1]:'—';
 // เมื่อเลขที่เติมตามสูตร 6/9 อยู่ตำแหน่งที่ 7 ให้แสดง (เลข) ต่อท้ายวินบนเว็บและตอนคัดลอก
 currentWin=digits.slice(0,6)+(added69&&digits.length===7?'('+added69+')':'');
 winNode.textContent=currentWin;
 runNode.textContent=currentRun;
 copy.disabled=false;copy.classList.remove('copied');copy.textContent='คัดลอก';
}
inputs.forEach((input,index)=>{
 let previousLength=input.value.length;
 input.addEventListener('input',()=>{
  input.value=input.value.replace(/\D/g,'').slice(0,3);
  notice.textContent='กรอกตัวเลข 3 หลักในแต่ละแถว';
  calculate();
  if(previousLength<3 && input.value.length===3 && index<inputs.length-1){
   inputs[index+1].focus();
  }
  previousLength=input.value.length;
 });
});
copy.addEventListener('click',async()=>{
 if(!currentWin)return;
 try{
  const txt='ใบเปิด 3 นอยเย็น/สา/พัฒ\n🏃รูด   '+currentRun+'\n🔅วิน   '+currentWin;
  if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(txt);
  else{const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw new Error('copy failed');}
  copy.classList.add('copied');copy.textContent='คัดลอก';notice.textContent='คัดลอกรูดและวินเรียบร้อยแล้ว';
 }catch(e){notice.textContent='คัดลอกไม่สำเร็จ กรุณาลองอีกครั้ง';}
});
calculate();
</script>
</body>
</html>
