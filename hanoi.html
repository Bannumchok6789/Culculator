<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บ้านนำโชค 6789 | ใบเปิด 3 ฮานอย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #090d16); 
            min-height: 100vh; 
            color: #f8fafc; 
            font-family: 'Prompt', sans-serif; 
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.65); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
        }
        .glass-input { 
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            color: #ffffff; 
        }
        .glass-input:focus { 
            border-color: #fbbf24; 
            outline: none; 
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
        }
        .btn-gold { 
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); 
            color: #0f172a; 
            font-weight: 700; 
            transition: all 0.3s ease; 
        }
        .btn-gold:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5); 
        }
        .btn-reset { 
            background: rgba(51, 65, 85, 0.6); 
            border: 1px solid rgba(148, 163, 184, 0.2); 
            color: #cbd5e1; 
            font-weight: 600; 
            transition: all 0.3s ease; 
        }
        .btn-reset:hover { 
            background: rgba(71, 85, 105, 0.8); 
            color: #ffffff; 
            transform: translateY(-1px); 
        }
        .btn-copy {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-copy:hover:not(:disabled) {
            background: rgba(51, 65, 85, 0.9);
            border-color: #fbbf24;
            color: #fbbf24;
        }
        .btn-copy.copied {
            background: #0ea5e9 !important;
            border-color: #0ea5e9 !important;
            color: #ffffff !important;
        }
        .btn-copy:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .res-val {
            font-size: 22px !important;
            font-weight: 300 !important;
            line-height: 1.35;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between">

    <div class="max-w-2xl mx-auto w-full space-y-6 my-auto">
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 font-kanit">สูตรคำนวณใบเปิด 3 ฮานอย</h1>
            <p class="text-amber-400/90 font-medium text-lg mt-1 font-kanit">🏠 บ้านนำโชค 6789</p>
        </header>

        <main class="glass-card rounded-3xl p-6 space-y-6">
            <!-- ตารางกรอกตัวเลข -->
            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse" aria-label="ตารางสูตรคำนวณใบเปิด 3 ฮานอย">
                    <thead>
                        <tr class="text-slate-300 border-b border-slate-700/60 text-sm">
                            <th class="pb-3 font-semibold">กรอกตัวเลข</th>
                            <th class="pb-3 font-semibold">ผลลัพธ์</th>
                            <th class="pb-3 font-semibold">ชื่อหวย</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/40">
                        <tr>
                            <td class="py-3 px-2">
                                <!-- ปรับความกว้างให้อยู่ในระดับพอดี (w-28 หรือประมาณ 112px) -->
                                <input class="w-28 mx-auto text-center glass-input rounded-xl py-2 px-3 text-lg font-bold tracking-widest block" id="a" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="000" aria-label="กรอกเลขฮานอยพิเศษ 3 หลัก">
                            </td>
                            <td class="py-3 px-2"><span class="res-val text-rose-400" id="out-a">—</span></td>
                            <td class="py-3 px-2 text-slate-200 font-medium">🇻🇳 ฮานอยพิเศษ 🇻🇳</td>
                        </tr>
                        <tr>
                            <td class="py-3 px-2">
                                <input class="w-28 mx-auto text-center glass-input rounded-xl py-2 px-3 text-lg font-bold tracking-widest block" id="b" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="000" aria-label="กรอกเลขฮานอย VIP 3 หลัก">
                            </td>
                            <td class="py-3 px-2"><span class="res-val text-rose-400" id="out-b">—</span></td>
                            <td class="py-3 px-2 text-slate-200 font-medium">🇻🇳 ฮานอย VIP 🇻🇳</td>
                        </tr>
                        <tr>
                            <td class="py-3 px-2">
                                <input class="w-28 mx-auto text-center glass-input rounded-xl py-2 px-3 text-lg font-bold tracking-widest block" id="c" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="000" aria-label="กรอกเลขฮานอยปกติ 3 หลัก">
                            </td>
                            <td class="py-3 px-2"><span class="res-val text-rose-400" id="out-c">—</span></td>
                            <td class="py-3 px-2 text-slate-200 font-medium">🇻🇳 ฮานอยปกติ 🇻🇳</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button class="w-full btn-reset py-2.5 rounded-xl text-sm flex items-center justify-center gap-2" id="reset" type="button">
                <i class="fa-solid fa-rotate-right"></i> รีเซ็ตข้อมูล
            </button>

            <!-- แสดงผลลัพธ์ (รูด บน, วิน ล่าง) -->
            <div class="grid grid-cols-1 gap-4">
                <div class="bg-slate-900/60 border border-slate-700/60 rounded-2xl p-4 text-center space-y-1">
                    <span class="text-xs text-slate-400 block font-semibold">🏃 รูด</span>
                    <span class="res-val text-amber-300 block" id="run">—</span>
                </div>
                <div class="bg-slate-900/60 border border-slate-700/60 rounded-2xl p-4 text-center space-y-1">
                    <span class="text-xs text-slate-400 block font-semibold">🔅 วิน</span>
                    <span class="res-val text-amber-300 block break-words" id="win">—</span>
                </div>
            </div>

            <button class="w-full btn-gold py-3.5 rounded-xl font-bold text-base flex items-center justify-center gap-2 shadow-lg" id="copy" type="button" disabled>
                <i class="fa-regular fa-copy"></i> คัดลอกผลลัพธ์
            </button>
            <p class="text-xs text-slate-400 text-center min-h-[16px]" id="notice" aria-live="polite">กรอกตัวเลข 3 หลักในแต่ละแถว</p>
        </main>
    </div>

    <script>
    'use strict';
    const keys = ['a', 'b', 'c'];
    const inputs = keys.map(k => document.getElementById(k));
    const copy = document.getElementById('copy');
    const winNode = document.getElementById('win');
    const runNode = document.getElementById('run');
    const notice = document.getElementById('notice');

    document.getElementById('reset').addEventListener('click', () => {
        inputs.forEach(input => {
            input.value = '';
            input.dispatchEvent(new Event('input', { bubbles: false }));
        });
        notice.textContent = 'กรอกตัวเลข 3 หลักในแต่ละแถว';
        inputs[0].focus();
    });

    let currentWin = '';
    let currentRun = '';

    function calculate() {
        const outcomes = inputs.map((input, i) => {
            const value = input.value;
            const result = /^\d{3}$/.test(value) ? (Number(value) * 7 / 100).toFixed(2) : null;
            document.getElementById('out-' + keys[i]).textContent = result ?? '—';
            return result;
        });

        if (outcomes.some(n => n === null)) {
            currentWin = '';
            currentRun = '';
            winNode.textContent = '—';
            runNode.textContent = '—';
            copy.disabled = true;
            copy.classList.remove('copied');
            copy.textContent = 'คัดลอกผลลัพธ์';
            return;
        }

        let digits = [...new Set(outcomes.join('').replace(/\D/g, ''))].join('');
        const has6 = digits.includes('6'), has9 = digits.includes('9');
        const added69 = has6 && !has9 ? '9' : has9 && !has6 ? '6' : '';
        if (added69) digits += added69;

        const totalDigitsLen = digits.length;

        while (digits.length < 6) {
            digits += '0';
        }

        if (totalDigitsLen >= 8) {
            currentRun = digits[7] + '-' + digits[0];
        } else if (totalDigitsLen === 7) {
            currentRun = digits[0] + '-' + digits[6];
        } else {
            currentRun = digits[0] + '-' + digits[1];
        }

        if (digits.length >= 7) {
            currentWin = digits.slice(0, 6) + '(' + digits[6] + ')';
        } else {
            currentWin = digits.slice(0, 6);
        }

        winNode.textContent = currentWin;
        runNode.textContent = currentRun;
        copy.disabled = false;
        copy.classList.remove('copied');
        copy.textContent = 'คัดลอกผลลัพธ์';
    }

    inputs.forEach((input, index) => {
        let previousLength = input.value.length;
        input.addEventListener('input', () => {
            input.value = input.value.replace(/\D/g, '').slice(0, 3);
            notice.textContent = 'กรอกตัวเลข 3 หลักในแต่ละแถว';
            calculate();
            if (previousLength < 3 && input.value.length === 3 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
            previousLength = input.value.length;
        });
    });

    copy.addEventListener('click', async () => {
        if (!currentWin) return;
        try {
            const txt = 'ใบเปิด 3 นอยเย็น/สา/พัฒ\n🏃รูด   ' + currentRun + '\n🔅วิน   ' + currentWin;
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(txt);
            } else {
                const t = document.createElement('textarea');
                t.value = txt;
                t.style.position = 'fixed';
                t.style.opacity = '0';
                document.body.appendChild(t);
                t.select();
                const ok = document.execCommand('copy');
                t.remove();
                if (!ok) throw new Error('copy failed');
            }
            copy.classList.add('copied');
            copy.textContent = 'คัดลอกเรียบร้อย';
            notice.textContent = 'คัดลอกรูดและวินเรียบร้อยแล้ว';
        } catch (e) {
            notice.textContent = 'คัดลอกไม่สำเร็จ กรุณาลองอีกครั้ง';
        }
    });

    calculate();
    </script>
</body>
</html>
